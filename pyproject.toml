[project]
name = "jaffle-shop"
version = "0.1.0"
description = "A self-contained dbt project using DuckDB"
requires-python = ">=3.13"
dependencies = [
    "dbt-duckdb>=1.10.1",
    "dbt-core>=1.12.0",
    "sqlfluff>=3",
    # Constrain chardet to avoid RequestsDependencyWarning from requests
    "chardet<6",
    "dbt-sqlserver>=1.12.2",
    "pyodbc>=5.5.0",
    "streamlit>=1.67.0",
    "pandas>=3.1.1",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
