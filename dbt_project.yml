name: 'jaffle_shop'

config-version: 2
version: '0.1'

profile: 'jaffle_shop'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analysis"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
    - "target"
    - "dbt_modules"
    - "logs"

require-dbt-version: [">=1.11.0", "<2.0.0"]

vars:
  segment_high_ltv: 30
  segment_medium_ltv: 15
  revenue_lookback_offset_days: -3   # recompute the last 3 days on each incremental run

seeds:
  +enabled: "{{ target.name != 'prod' }}"
  +docs:
    node_color: '#cd7f32'

models:
  jaffle_shop:
    +materialized: table
    marts:
      +docs:
        node_color: 'gold'
    staging:
      +materialized: view
      +docs:
        node_color: 'silver'
    +docs:
      node_color: 'gold'
