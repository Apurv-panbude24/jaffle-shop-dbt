name: Publish dbt docs

# Builds dbt docs (including the lineage graph) and deploys them to GitHub Pages
# on every push to main. Requires Pages > Source = "GitHub Actions" in repo settings.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --frozen
      - name: Build project and docs
        run: |
          uv run dbt build
          uv run dbt docs generate
      - name: Assemble site
        run: |
          mkdir _site
          cp target/index.html target/manifest.json target/catalog.json _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
