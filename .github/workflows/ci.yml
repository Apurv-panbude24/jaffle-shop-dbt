name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: SQL lint (sqlfluff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --frozen
      # Scoped to the marts layer and tests: the upstream dbt Labs models
      # predate this style config and are intentionally left untouched.
      - name: Lint marts and tests
        run: uv run sqlfluff lint models/marts tests

  build:
    name: dbt build + docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --frozen
      - name: dbt debug
        run: uv run dbt debug
      - name: dbt build (seeds, models, data tests, unit tests)
        run: uv run dbt build
      - name: Re-run incremental model (idempotency check)
        run: uv run dbt build --select daily_revenue
      - name: Generate docs
        run: uv run dbt docs generate
      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: |
            target/index.html
            target/catalog.json
            target/manifest.json
